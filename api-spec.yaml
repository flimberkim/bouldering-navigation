openapi: 3.0.3
info:
  title: Bouldering Navigation API
  version: "1.0"
  description: >
    Source-of-truth API contract for bouldering-navigation.
    Owned by the backend agent — only the backend agent should change this file,
    and only in the same change that implements the corresponding backend code.
    The frontend agent must treat this file as read-only and build against it as-is.
servers:
  - url: http://localhost:8080

paths:
  /api/mountains:
    get:
      summary: Search mountains by name (with nested rocks/problems)
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MountainSearchResponse"

  /api/problems/{id}:
    get:
      summary: Get problem detail with grade and completion video links
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailResponse"
        "404":
          description: Problem not found

  /api/admin/regions:
    get:
      summary: List all regions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionResponse"
    post:
      summary: Create a region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionResponse"
        "400":
          description: Validation error
        "409":
          description: Duplicate name

  /api/admin/regions/{id}:
    put:
      summary: Update a region
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionResponse"
        "404":
          description: Not found
    delete:
      summary: Delete a region
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
        "409":
          description: Region still has mountains referencing it

  /api/admin/mountains:
    get:
      summary: List all mountains
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MountainResponse"
    post:
      summary: Create a mountain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MountainRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainResponse"
        "400":
          description: Validation error
        "404":
          description: Region not found

  /api/admin/mountains/{id}:
    put:
      summary: Update a mountain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MountainRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainResponse"
        "404":
          description: Not found
    delete:
      summary: Delete a mountain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
        "409":
          description: Mountain still has rocks referencing it

  /api/admin/rocks:
    get:
      summary: List all rocks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RockResponse"
    post:
      summary: Create a rock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RockRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RockResponse"
        "400":
          description: Validation error
        "404":
          description: Mountain not found

  /api/admin/rocks/{id}:
    put:
      summary: Update a rock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RockRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RockResponse"
        "404":
          description: Not found
    delete:
      summary: Delete a rock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
        "409":
          description: Rock still has problems referencing it

  /api/admin/problems:
    get:
      summary: List all problems
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProblemResponse"
    post:
      summary: Create a problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProblemResponse"
        "400":
          description: Validation error
        "404":
          description: Rock not found

  /api/admin/problems/{id}:
    put:
      summary: Update a problem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProblemResponse"
        "404":
          description: Not found
    delete:
      summary: Delete a problem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
        "409":
          description: Problem still has completion videos referencing it

  /api/admin/videos:
    get:
      summary: List all completion videos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompletionVideoResponse"
    post:
      summary: Create a completion video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionVideoRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionVideoResponse"
        "400":
          description: Validation error
        "404":
          description: Problem not found

  /api/admin/videos/{id}:
    put:
      summary: Update a completion video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionVideoRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionVideoResponse"
        "404":
          description: Not found
    delete:
      summary: Delete a completion video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not found

components:
  schemas:
    MountainSearchResponse:
      type: object
      properties:
        mountainId: { type: integer, format: int64 }
        name: { type: string }
        regionName: { type: string }
        rocks:
          type: array
          items:
            $ref: "#/components/schemas/RockSearchResponse"

    RockSearchResponse:
      type: object
      properties:
        rockId: { type: integer, format: int64 }
        name: { type: string }
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ProblemSummaryResponse"

    ProblemSummaryResponse:
      type: object
      properties:
        problemId: { type: integer, format: int64 }
        name: { type: string }
        grade: { type: string }

    ProblemDetailResponse:
      type: object
      properties:
        problemId: { type: integer, format: int64 }
        name: { type: string }
        grade: { type: string }
        rockName: { type: string }
        mountainName: { type: string }
        regionName: { type: string }
        videos:
          type: array
          items:
            $ref: "#/components/schemas/VideoResponse"

    VideoResponse:
      type: object
      properties:
        videoId: { type: integer, format: int64 }
        url: { type: string }
        platform:
          type: string
          enum: [YOUTUBE, INSTAGRAM, OTHER]

    RegionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    RegionResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    MountainRequest:
      type: object
      required: [name, regionId]
      properties:
        name: { type: string }
        regionId: { type: integer, format: int64 }

    MountainResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        regionId: { type: integer, format: int64 }
        regionName: { type: string }

    RockRequest:
      type: object
      required: [name, mountainId]
      properties:
        name: { type: string }
        mountainId: { type: integer, format: int64 }

    RockResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        mountainId: { type: integer, format: int64 }
        mountainName: { type: string }

    ProblemRequest:
      type: object
      required: [name, grade, rockId]
      properties:
        name: { type: string }
        grade: { type: string }
        rockId: { type: integer, format: int64 }

    AdminProblemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        grade: { type: string }
        rockId: { type: integer, format: int64 }
        rockName: { type: string }

    CompletionVideoRequest:
      type: object
      required: [url, platform, problemId]
      properties:
        url: { type: string }
        platform:
          type: string
          enum: [YOUTUBE, INSTAGRAM, OTHER]
        problemId: { type: integer, format: int64 }

    CompletionVideoResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        platform:
          type: string
          enum: [YOUTUBE, INSTAGRAM, OTHER]
        problemId: { type: integer, format: int64 }
