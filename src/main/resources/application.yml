spring:
  application:
    name: bouldering-navigation
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bouldering_navigation}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-32-bytes-minimum-secret-key}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
