spring:
  datasource:
    url: jdbc:h2:mem:bouldering_navigation;MODE=MariaDB
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-32-bytes-minimum-secret-key}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
